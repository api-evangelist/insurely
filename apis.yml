aid: insurely
name: Insurely
description: >-
  Insurely is a European open finance platform that provides real-time access to
  consented, structured financial data across investments, pensions, insurance,
  savings, and credit. Its Open Finance API lets financial institutions, fintechs,
  and AI companies create end users, capture user consent, run data collections
  (including PSD2 banking data), and retrieve normalized wealth data through a
  signal-and-fetch webhook model. The API pairs a static backend API key with
  short-lived per-user JWT session tokens, pins versions via a date-based
  Insurely-Version header, and runs on EU-only AWS infrastructure under ISO/IEC
  27001 certification and GDPR compliance. Insurely is backed by Insight Partners.
